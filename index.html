<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>The Inner Circle</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;  .logo {
    width: 120px;
    height: 120px;
    object-fit: contain;
    display: block;
    margin: 0 auto 20px;
}                                                                            
        }

        body  { <img src="logo.png" alt="The Inner Circle Logo" class="logo">
            min-height: 100vh;
            background: #080808;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .container {
            max-width: 750px;
            padding: 40px 25px;
        }

        .small {
            color: #888;
            letter-spacing: 4px;
            font-size: 12px;
            text-transform: uppercase;
            margin-bottom: 25px;
        }

        h1 {
            font-size: clamp(45px, 9vw, 90px);
            letter-spacing: -3px;
            margin-bottom: 20px;
        }

        .line {
            width: 60px;
            height: 2px;
            background: white;
            margin: 25px auto;
        }

        .tagline {
            font-size: 20px;
            line-height: 1.6;
            color: #ccc;
        }

        .mystery {
            margin-top: 45px;
            color: #777;
            line-height: 1.8;
        }

        .coming {
            margin-top: 45px;
            font-size: 13px;
            letter-spacing: 5px;
            text-transform: uppercase;
        }

        footer {
            margin-top: 70px;
            font-size: 12px;
            color: #555;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="small">Something is coming</div>

        <h1>THE<br>INNER CIRCLE</h1>

        <div class="line"></div>

        <p class="tagline">
            A space for people who think differently,
            build together, and want to be part of something bigger.
        </p>

        <p class="mystery">
            Not a club.<br>
            Not just a community.<br>
            Something different.
        </p>

        <div class="coming">
            Coming Soon
        </div>

        <footer>
            © 2026 The Inner Circle
        </footer>

    </div>

</body>
</html>
